<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="azimanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#240c4a"/>
      <stop offset="50%" stop-color="#180733"/>
      <stop offset="100%" stop-color="#0e021f"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd599"/>
      <stop offset="50%" stop-color="#dfb06c"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="512" height="512" rx="128" fill="url(#azimanGrad)" stroke="#4c1d8c" stroke-width="8"/>
  
  <!-- Sacred Sun & Moon Symbol -->
  <g fill="url(#goldGrad)" transform="translate(6, -10)">
    <!-- Crescent Moon -->
    <path d="M 90 180 C 100 360 210 440 250 440 C 290 440 400 360 410 180 C 390 320 310 380 250 380 C 190 380 110 320 90 180 Z" />
    
    <!-- Central Ring -->
    <path d="M 250 140 A 55 55 0 1 0 250 250 A 55 55 0 1 0 250 140 M 250 168 A 27 27 0 1 1 250 222 A 27 27 0 1 1 250 168 Z" fill-rule="evenodd"/>
    
    <!-- 8 Rounded Sun Rays with Studs -->
    <!-- Top (0 deg) -->
    <rect x="244" y="105" width="12" height="25" rx="6" />
    <circle cx="250" cy="98" r="14" />
    
    <!-- Top-Right (45 deg) -->
    <g transform="rotate(45 250 195)">
      <rect x="244" y="105" width="12" height="25" rx="6" />
      <circle cx="250" cy="98" r="14" />
    </g>
    
    <!-- Right (90 deg) -->
    <g transform="rotate(90 250 195)">
      <rect x="244" y="105" width="12" height="25" rx="6" />
      <circle cx="250" cy="98" r="14" />
    </g>
    
    <!-- Bottom-Right (135 deg) -->
    <g transform="rotate(135 250 195)">
      <rect x="244" y="105" width="12" height="25" rx="6" />
      <circle cx="250" cy="98" r="14" />
    </g>
    
    <!-- Bottom (180 deg) -->
    <g transform="rotate(180 250 195)">
      <rect x="244" y="105" width="12" height="25" rx="6" />
      <circle cx="250" cy="98" r="14" />
    </g>
    
    <!-- Bottom-Left (225 deg) -->
    <g transform="rotate(225 250 195)">
      <rect x="244" y="105" width="12" height="25" rx="6" />
      <circle cx="250" cy="98" r="14" />
    </g>
    
    <!-- Left (270 deg) -->
    <g transform="rotate(270 250 195)">
      <rect x="244" y="105" width="12" height="25" rx="6" />
      <circle cx="250" cy="98" r="14" />
    </g>
    
    <!-- Top-Left (315 deg) -->
    <g transform="rotate(315 250 195)">
      <rect x="244" y="105" width="12" height="25" rx="6" />
      <circle cx="250" cy="98" r="14" />
    </g>
  </g>
</svg>